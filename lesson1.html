<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1과 플래시 카드 · Lesson 1 Flashcards</title>
<style>
  :root{
    --navy:#1F3864; --accent:#C0504D; --ink:#22262e; --muted:#7b8494;
    --line:#dfe4ec; --bg:#eef1f6; --card:#ffffff; --front:#f4f7fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px}

  header h1{margin:0; font-size:19px; color:var(--navy); letter-spacing:-.2px}
  header p{margin:3px 0 0; font-size:12px; color:var(--muted); font-style:italic}

  .bar{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:7px 13px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .chip[aria-pressed="true"]{background:var(--navy); color:#fff; border-color:var(--navy)}
  .chip.ghost{margin-left:auto; color:var(--muted)}

  .meter{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted)}
  .track{flex:1; height:5px; background:#dde3ec; border-radius:99px; overflow:hidden}
  .fill{height:100%; width:0; background:var(--navy); border-radius:99px; transition:width .25s}

  .scene{perspective:1200px}
  .card{
    position:relative; width:100%; aspect-ratio:1.55/1; min-height:230px;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1px solid var(--line); border-radius:16px; background:var(--card);
    box-shadow:0 2px 10px rgba(31,56,100,.07);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; text-align:center; overflow:hidden;
  }
  .face.front{background:var(--front)}
  .face.back{transform:rotateY(180deg)}

  .glyph{font-weight:700; color:var(--navy); line-height:1.05}
  .glyph.v{font-size:clamp(90px,26vw,140px)}
  .glyph.g{font-size:clamp(28px,8.4vw,42px); line-height:1.25}
  .kind{margin-top:10px; font-size:11px; color:#b3bbc8; letter-spacing:.4px}

  .rom{font-size:clamp(26px,8vw,38px); font-weight:700; color:var(--accent); margin:6px 0 4px}
  .tip-ko{font-size:clamp(15px,4.3vw,18px); margin:2px 0}
  .tip-en{font-size:clamp(12px,3.4vw,14px); color:var(--muted); font-style:italic; margin:2px 0 8px}
  .tip-en.warn{color:var(--accent)}
  .word{font-size:clamp(17px,5vw,22px); font-weight:700; color:var(--navy)}
  .word small{font-weight:400; color:var(--muted); font-size:.72em; margin-left:6px}
  .mean{font-size:clamp(20px,6vw,27px); margin:2px 0 6px}
  .when{font-size:clamp(12px,3.6vw,15px); color:#666}
  svg.mouth{width:clamp(82px,22vw,104px); height:auto; display:block; margin-bottom:2px}

  .hint{text-align:center; font-size:11.5px; color:var(--muted)}

  .row{display:flex; gap:8px}
  button.act{
    flex:1; padding:13px 8px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-size:14px; font-family:inherit; cursor:pointer; color:var(--ink);
  }
  button.act:active{transform:translateY(1px)}
  button.act.good{border-color:#a8c8a0; color:#2f6b2a}
  button.act.again{border-color:#e3b3b1; color:var(--accent)}
  button.act.nav{flex:0 0 58px; color:var(--muted)}
  button.act:disabled{opacity:.35; cursor:default}
  .speak{
    position:absolute; top:10px; right:12px; border:none; background:transparent;
    font-size:19px; cursor:pointer; opacity:.5; padding:4px;
  }
  .speak:hover{opacity:1}

  .done{
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px 18px; text-align:center;
  }
  .done h2{margin:0 0 6px; font-size:21px; color:var(--navy)}
  .done p{margin:4px 0; font-size:14px; color:var(--muted)}
  .score{font-size:40px; font-weight:700; color:var(--navy); margin:12px 0}
  .done .row{margin-top:16px}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>1과 플래시 카드 — 모음과 인사</h1>
    <p>Lesson 1 · Tap the card to flip. Vowels and greetings.</p>
  </header>

  <div class="bar">
    <button class="chip" data-deck="all" aria-pressed="true">전체 All</button>
    <button class="chip" data-deck="vowel" aria-pressed="false">모음 Vowels</button>
    <button class="chip" data-deck="greet" aria-pressed="false">인사 Greetings</button>
    <button class="chip ghost" id="shuffle">섞기 Shuffle</button>
  </div>

  <div class="meter">
    <span id="count">1 / 9</span>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div id="study">
    <div class="scene">
      <div class="card" id="card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <p class="hint" id="hint">카드를 누르면 뒤집힙니다 · Tap to flip &nbsp;·&nbsp; Space / ← →</p>
    <div class="row" style="margin-top:2px">
      <button class="act nav" id="prev" title="이전">←</button>
      <button class="act again" id="again">다시 Again</button>
      <button class="act good" id="know">알아요 Got it</button>
      <button class="act nav" id="next" title="다음">→</button>
    </div>
  </div>

  <div id="result" class="done hide">
    <h2>끝났습니다!</h2>
    <p>Round finished</p>
    <div class="score" id="score">0 / 0</div>
    <p id="resultMsg"></p>
    <div class="row">
      <button class="act again" id="retryWrong">틀린 것만 Again only</button>
      <button class="act" id="retryAll">처음부터 Restart</button>
    </div>
  </div>

</div>

<script>
// ── 입 모양 SVG ────────────────────────────────
function mouth(ow, oh, rounded){
  const W=200,H=150,cx=100,cy=75;
  const lw=ow+(rounded?44:30), lh=oh+(rounded?44:30);
  const tongue = oh>46
    ? `<ellipse cx="${cx}" cy="${cy+oh*0.28}" rx="${ow/3}" ry="${oh/6}" fill="#b96e6e"/>` : '';
  const arrow = (dx)=>{
    const tipIn = rounded;
    const x0 = cx + dx*(lw/2 + (tipIn?14:24));
    const x1 = cx + dx*(lw/2 + (tipIn?2:6));
    const [ax,bx] = tipIn ? [x0,x1] : [x1,x0];
    return `<line x1="${ax}" y1="${cy}" x2="${bx}" y2="${cy}" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/>
            <polygon points="${bx},${cy} ${bx-dx*10},${cy-7} ${bx-dx*10},${cy+7}" fill="#1F3864"/>`;
  };
  return `<svg class="mouth" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="${cx}" cy="${cy}" rx="${lw/2}" ry="${lh/2}" fill="#f0c4c4" stroke="#c87878" stroke-width="3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${ow/2}" ry="${oh/2}" fill="#5a282d" stroke="#461e23" stroke-width="2"/>
    ${tongue}${arrow(-1)}${arrow(1)}
  </svg>`;
}

// ── 카드 데이터 ────────────────────────────────
const CARDS = [
  {deck:'vowel', say:'아', glyph:'ㅏ', m:[118,96,false], rom:'a',
   ko:'입을 크게 벌려요', en:'Open wide. Lips flat.', word:'아  ·  아이', gloss:'child'},
  {deck:'vowel', say:'이', glyph:'ㅣ', m:[140,34,false], rom:'i',
   ko:'입을 옆으로 펴요', en:'Spread wide, like a smile.', word:'이  ·  이', gloss:'tooth'},
  {deck:'vowel', say:'우', glyph:'ㅜ', m:[64,58,true], rom:'u',
   ko:'입술을 모아 내밀어요', en:'Round and push forward.', word:'우', gloss:''},
  {deck:'vowel', say:'오', glyph:'ㅗ', m:[92,78,true], rom:'o',
   ko:'ㅜ보다 조금 더 벌려요', en:'Like ㅜ, a bit more open.', word:'오  ·  오이', gloss:'cucumber'},
  {deck:'vowel', say:'으', glyph:'ㅡ', m:[140,26,false], rom:'eu',
   ko:'입술을 옆으로 펴요', en:'Spread. NEVER round.', warn:true, word:'으', gloss:''},
  {deck:'greet', say:'안녕하세요', glyph:'안녕하세요?', rom:'an-nyeong-ha-se-yo',
   mean:'Hello.', when:'아침·점심·저녁 모두 / any time of day'},
  {deck:'greet', say:'안녕히 가세요', glyph:'안녕히 가세요.', rom:'an-nyeong-hi ga-se-yo',
   mean:'Goodbye.', when:'가는 사람에게 / to the person LEAVING'},
  {deck:'greet', say:'안녕히 계세요', glyph:'안녕히 계세요.', rom:'an-nyeong-hi gye-se-yo',
   mean:'Goodbye.', when:'남는 사람에게 / to the person STAYING'},
  {deck:'greet', say:'감사합니다', glyph:'감사합니다.', rom:'gam-sa-ham-ni-da',
   mean:'Thank you.', when:'언제나 / always polite'},
];

// ── 상태 ────────────────────────────────
let deck='all', queue=[], i=0, wrong=[], known=0;

const $ = id => document.getElementById(id);
const cardEl=$('card'), frontEl=$('front'), backEl=$('back');

function build(){
  queue = CARDS.filter(c => deck==='all' || c.deck===deck).map((c,idx)=>({...c, id:idx}));
  i=0; wrong=[]; known=0;
  $('result').classList.add('hide'); $('study').classList.remove('hide');
  render();
}
function shuffle(){
  for(let k=queue.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[queue[k],queue[j]]=[queue[j],queue[k]];}
  i=0; render();
}
function render(){
  if(i>=queue.length){ return finish(); }
  const c=queue[i];
  cardEl.classList.remove('flipped');
  frontEl.innerHTML =
    `<div class="glyph ${c.deck==='vowel'?'v':'g'}">${c.glyph}</div>
     <div class="kind">${c.deck==='vowel'?'모음 vowel':'인사 greeting'}</div>`;
  backEl.innerHTML = c.deck==='vowel'
    ? `<button class="speak" data-say="${c.say}" title="듣기">🔊</button>
       ${mouth(...c.m)}
       <div class="rom">${c.rom}</div>
       <div class="tip-ko">${c.ko}</div>
       <div class="tip-en${c.warn?' warn':''}">${c.en}</div>
       <div class="word">${c.word}${c.gloss?`<small>${c.gloss}</small>`:''}</div>`
    : `<button class="speak" data-say="${c.say}" title="듣기">🔊</button>
       <div class="rom">${c.rom}</div>
       <div class="mean">${c.mean}</div>
       <div class="when">${c.when}</div>`;
  $('count').textContent = `${i+1} / ${queue.length}`;
  $('fill').style.width = `${(i/queue.length)*100}%`;
  $('prev').disabled = i===0;
}
function advance(ok){
  if(ok) known++; else wrong.push(queue[i]);
  i++; render();
}
function finish(){
  $('study').classList.add('hide');
  $('result').classList.remove('hide');
  $('fill').style.width='100%';
  $('count').textContent = `${queue.length} / ${queue.length}`;
  $('score').textContent = `${known} / ${queue.length}`;
  $('retryWrong').disabled = wrong.length===0;
  $('resultMsg').textContent = wrong.length===0
    ? '전부 맞혔습니다. 잘했어요!  Perfect — well done!'
    : `다시 볼 카드 ${wrong.length}장 · ${wrong.length} card(s) to review`;
}

// ── 이벤트 ────────────────────────────────
cardEl.addEventListener('click', e=>{
  if(e.target.closest('.speak')) return;
  cardEl.classList.toggle('flipped');
});
document.addEventListener('click', e=>{
  const b=e.target.closest('.speak'); if(!b) return;
  try{
    const u=new SpeechSynthesisUtterance(b.dataset.say);
    u.lang='ko-KR'; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(_){}
});
$('know').onclick  = ()=>advance(true);
$('again').onclick = ()=>advance(false);
$('next').onclick  = ()=>{ i=Math.min(i+1,queue.length); render(); };
$('prev').onclick  = ()=>{ if(i>0){i--; render();} };
$('shuffle').onclick = shuffle;
$('retryAll').onclick = build;
$('retryWrong').onclick = ()=>{
  queue=[...wrong]; i=0; wrong=[]; known=0;
  $('result').classList.add('hide'); $('study').classList.remove('hide'); render();
};
document.querySelectorAll('.chip[data-deck]').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.chip[data-deck]').forEach(b=>b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    deck=btn.dataset.deck; build();
  };
});
document.addEventListener('keydown', e=>{
  if($('study').classList.contains('hide')) return;
  if(e.code==='Space'){ e.preventDefault(); cardEl.classList.toggle('flipped'); }
  if(e.key==='ArrowRight') $('next').click();
  if(e.key==='ArrowLeft')  $('prev').click();
  if(e.key==='1') $('again').click();
  if(e.key==='2') $('know').click();
});

build();
</script>
</body>
</html>
